name: Test and Coverage

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main, "**"]

jobs:
  test_and_coverage:
    name: Run tests and generate coverage reports
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ims_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CI_DOTENV: ${{ secrets.CI_DOTENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            Django==6.0.3 \
            djangorestframework \
            djangorestframework-simplejwt \
            django-cors-headers \
            python-dotenv \
            sendgrid \
            psycopg2-binary \
            coverage

      - name: Load environment from .env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -n "$CI_DOTENV" ]; then
              printf '%s\n' "$CI_DOTENV" > .env
            else
              echo "No .env file found and CI_DOTENV secret is empty."
              exit 1
            fi
          fi

          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue ;;
            esac
            if [[ "$line" == *=* ]]; then
              key="${line%%=*}"
              value="${line#*=}"
              key="$(echo "$key" | xargs)"
              echo "$key=$value" >> "$GITHUB_ENV"
            fi
          done < .env

      - name: Validate required .env keys
        shell: bash
        run: |
          required=(SECRET_KEY POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_TEST_USER POSTGRES_TEST_PASSWORD DEFAULT_FROM_EMAIL ADMIN_PANEL_URL)
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required .env key: $key"
              exit 1
            fi
          done

      - name: Mask secret values in logs
        shell: bash
        run: |
          echo "::add-mask::${SECRET_KEY}"
          echo "::add-mask::${POSTGRES_PASSWORD}"
          echo "::add-mask::${POSTGRES_TEST_PASSWORD}"
          echo "::add-mask::${SENDGRID_API_KEY}"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres -d ims_db && break
            sleep 2
          done

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: python -m coverage run --rcfile=.coveragerc manage.py test

      - name: Create coverage reports (terminal + HTML + markdown)
        run: |
          python -m coverage report --rcfile=.coveragerc
          python -m coverage html --rcfile=.coveragerc
          python -m coverage json --rcfile=.coveragerc -o coverage.json
          python scripts/generate_coverage_markdown.py coverage.json coverage-summary.md coverage-details.md

      - name: Publish markdown summary to workflow output
        run: |
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat coverage-details.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-summary.md
            coverage-details.md
            coverage.json
            htmlcov/
