databases:
  - name: ims-db
    databaseName: ims_db
    user: ims_user
    plan: free

services:
  - type: web
    name: ims-backend
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ims_backend.wsgi:application"
    envVars:
      - key: DJANGO_ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ims-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://ims-frontend-ruw7.onrender.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_PANEL_URL
        sync: false
